<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="dusksky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb25e"/>
      <stop offset=".45" stop-color="#ff7e5f"/>
      <stop offset=".75" stop-color="#e84e8a"/>
      <stop offset="1" stop-color="#5e2a84"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2d5e"/>
      <stop offset="1" stop-color="#180a26"/>
    </linearGradient>
    <linearGradient id="convertible" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd8c8"/>
      <stop offset=".6" stop-color="#129e92"/>
      <stop offset="1" stop-color="#065e58"/>
    </linearGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8cf"/>
      <stop offset=".7" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#ffb25e"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#dusksky)"/>

  <!-- low sun with retro slit cuts near its base -->
  <circle cx="500" cy="520" r="265" fill="#ffdf8e" opacity=".22"/>
  <circle cx="500" cy="520" r="150" fill="url(#sunglow)"/>
  <rect x="330" y="540" width="340" height="8" fill="#ff7e5f" opacity=".85"/>
  <rect x="345" y="566" width="310" height="11" fill="#f2668b" opacity=".85"/>
  <rect x="365" y="596" width="270" height="14" fill="#e84e8a" opacity=".9"/>

  <!-- skyline shoulders left and right of the sun -->
  <g fill="#4a1c46" opacity=".8">
    <rect x="-8" y="600" width="105" height="150"/>
    <rect x="112" y="556" width="70" height="194"/>
    <rect x="196" y="618" width="92" height="132"/>
    <rect x="716" y="606" width="88" height="144"/>
    <rect x="818" y="548" width="66" height="202"/>
    <rect x="898" y="596" width="112" height="154"/>
  </g>
  <g fill="#ffd76e" opacity=".85">
    <rect x="128" y="580" width="9" height="12"/><rect x="146" y="612" width="9" height="12"/>
    <rect x="836" y="574" width="9" height="12"/><rect x="836" y="606" width="9" height="12"/>
    <rect x="30" y="636" width="9" height="12"/><rect x="928" y="626" width="9" height="12"/>
  </g>

  <!-- palm left -->
  <g stroke="#2e1030" fill="#2e1030">
    <path d="M150 800 Q132 690 168 590" stroke-width="19" fill="none" stroke-linecap="round"/>
    <path d="M168 590 Q96 528 28 542 Q92 588 162 606 Z"/>
    <path d="M168 590 Q140 502 84 472 Q128 548 158 598 Z"/>
    <path d="M168 590 Q196 496 258 470 Q204 550 178 598 Z"/>
    <path d="M168 590 Q238 540 306 556 Q238 596 176 606 Z"/>
    <path d="M168 590 Q160 520 196 470 Q186 552 176 596 Z"/>
  </g>
  <!-- palm right, smaller -->
  <g stroke="#2e1030" fill="#2e1030">
    <path d="M868 812 Q884 716 852 632" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M852 632 Q788 580 728 592 Q788 632 846 646 Z"/>
    <path d="M852 632 Q830 556 782 530 Q822 592 844 638 Z"/>
    <path d="M852 632 Q876 552 928 528 Q882 596 860 640 Z"/>
    <path d="M852 632 Q914 588 972 600 Q912 634 858 646 Z"/>
  </g>

  <!-- the boulevard: a perspective road -->
  <path d="M0 1250 L392 748 L608 748 L1000 1250 Z" fill="url(#asphalt)"/>
  <path d="M0 1250 L392 748 L430 748 L180 1250 Z" fill="#ffd76e" opacity=".55"/>
  <path d="M1000 1250 L608 748 L570 748 L820 1250 Z" fill="#ffd76e" opacity=".55"/>
  <g fill="#fff3b0">
    <rect x="492" y="790" width="16" height="26"/>
    <rect x="488" y="856" width="24" height="40"/>
    <rect x="482" y="946" width="36" height="62"/>
    <rect x="474" y="1076" width="52" height="96"/>
  </g>
  <!-- sidewalks -->
  <path d="M0 1250 L392 748 L300 748 L0 1080 Z" fill="#3a1440" opacity=".8"/>
  <path d="M1000 1250 L608 748 L700 748 L1000 1080 Z" fill="#3a1440" opacity=".8"/>

  <!-- teal convertible cruising toward the viewer -->
  <g>
    <ellipse cx="500" cy="1018" rx="238" ry="30" fill="#000000" opacity=".35"/>
    <path d="M268 1006 Q272 928 340 906 L660 906 Q728 928 732 1006 Q732 1040 690 1044 L310 1044 Q268 1040 268 1006 Z" fill="url(#convertible)"/>
    <path d="M318 912 Q340 838 430 824 L586 824 Q664 838 684 912 Q560 890 500 890 Q440 890 318 912 Z" fill="#0b3d4a"/>
    <rect x="352" y="836" width="296" height="14" rx="7" fill="#bfefff" opacity=".55"/>
    <!-- driver silhouette -->
    <circle cx="556" cy="806" r="27" fill="#241126"/>
    <path d="M520 836 Q524 800 556 798 Q590 800 592 836 Z" fill="#241126"/>
    <path d="M600 830 Q652 812 690 826" stroke="#241126" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- grille, lamps, plate -->
    <rect x="356" y="966" width="288" height="26" rx="12" fill="#0a2e33"/>
    <circle cx="322" cy="978" r="21" fill="#fff6c8"/>
    <circle cx="678" cy="978" r="21" fill="#fff6c8"/>
    <circle cx="322" cy="978" r="21" fill="none" stroke="#ffd76e" stroke-width="4"/>
    <circle cx="678" cy="978" r="21" fill="none" stroke="#ffd76e" stroke-width="4"/>
    <rect x="452" y="1008" width="96" height="28" rx="5" fill="#f4efe6"/>
    <text x="500" y="1030" font-family="monospace" font-size="21" font-weight="bold" fill="#223" text-anchor="middle">VICE-6</text>
    <!-- wheels -->
    <circle cx="330" cy="1044" r="34" fill="#12060f"/>
    <circle cx="670" cy="1044" r="34" fill="#12060f"/>
    <circle cx="330" cy="1044" r="15" fill="#cfd8dc"/>
    <circle cx="670" cy="1044" r="15" fill="#cfd8dc"/>
  </g>
</svg>
