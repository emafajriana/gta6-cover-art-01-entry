<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1450"/>
      <stop offset=".42" stop-color="#93356b"/>
      <stop offset=".68" stop-color="#ff7e47"/>
      <stop offset=".85" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a56"/>
      <stop offset="1" stop-color="#241428"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffd166" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#sky)"/>
  <circle cx="500" cy="800" r="330" fill="url(#sunGlow)"/>
  <circle cx="500" cy="800" r="128" fill="#fff3b0"/>
  <circle cx="500" cy="800" r="112" fill="#ffd166"/>

  <!-- distant towers on the horizon -->
  <g fill="#4a2050">
    <rect x="30" y="560" width="86" height="250"/>
    <rect x="140" y="610" width="60" height="200"/>
    <rect x="700" y="585" width="74" height="225"/>
    <rect x="800" y="545" width="92" height="265"/>
    <rect x="915" y="620" width="58" height="190"/>
  </g>
  <g fill="#ffd166" opacity=".75">
