    <rect x="722" y="615" width="12" height="16"/><rect x="826" y="580" width="12" height="16"/>
    <rect x="856" y="640" width="12" height="16"/><rect x="152" y="645" width="10" height="14"/>
  </g>

  <!-- the boulevard -->
  <polygon points="0,1250 355,810 645,810 1000,1250" fill="url(#road)"/>
  <polygon points="0,1250 0,810 355,810" fill="#3d2040"/>
  <polygon points="1000,1250 1000,810 645,810" fill="#3d2040"/>
  <g fill="#ffd98a">
