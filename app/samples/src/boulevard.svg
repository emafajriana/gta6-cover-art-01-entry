    <rect x="330" y="1078" width="150" height="26" rx="9" fill="#0e0616"/>
    <circle cx="330" cy="1180" r="34" fill="#0a0510"/>
    <circle cx="330" cy="1180" r="17" fill="#8a7f96"/>
