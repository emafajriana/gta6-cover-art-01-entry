<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5e8a"/>
      <stop offset="1" stop-color="#b02368"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c97b4e"/>
      <stop offset="1" stop-color="#a55a32"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1a12"/>
      <stop offset="1" stop-color="#170c07"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset=".5" stop-color="#274b73"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
  </defs>

  <!-- no background: this sample is a cut-out, so the figure keeps a
       real alpha channel and can burst out of the cover's portal -->

  <!-- hair, back mass -->
  <path d="M500 96 q-176 0 -196 168 q-12 104 30 176 l66 0 q-26 -120 -8 -196 q20 -82 108 -82 q88 0 108 82 q18 76 -8 196 l66 0 q42 -72 30 -176 q-20 -168 -196 -168z" fill="url(#hair)"/>

  <!-- neck and shoulders -->
  <path d="M452 470 l96 0 l0 74 q-48 26 -96 0z" fill="url(#skin)"/>
  <path d="M452 520 q48 24 96 0 l0 26 q-48 22 -96 0z" fill="#8a4525"/>

  <!-- face -->
  <path d="M500 128 q-118 0 -124 128 q-4 92 34 158 q34 58 90 58 q56 0 90 -58 q38 -66 34 -158 q-6 -128 -124 -128z" fill="url(#skin)"/>
  <!-- ears -->
  <circle cx="372" cy="330" r="24" fill="url(#skin)"/>
  <circle cx="628" cy="330" r="24" fill="url(#skin)"/>
  <!-- gold hoops -->
  <circle cx="368" cy="362" r="17" fill="none" stroke="#ffd166" stroke-width="8"/>
  <circle cx="632" cy="362" r="17" fill="none" stroke="#ffd166" stroke-width="8"/>

  <!-- hair, front sweep -->
  <path d="M376 268 q-6 -140 124 -140 q130 0 124 140 q-2 26 -14 40 q-8 -66 -44 -92 q-90 34 -150 -6 q-30 20 -34 62 q-4 -2 -6 -4z" fill="url(#hair)"/>

  <!-- sunglasses -->
  <g>
    <path d="M382 316 q58 -14 118 -14 q60 0 118 14 l-8 62 q-6 40 -48 40 l-40 0 q-22 0 -30 -22 q-8 22 -30 22 l-40 0 q-42 0 -48 -40z" fill="url(#lens)" stroke="#0a0a12" stroke-width="7"/>
    <path d="M392 322 q40 -8 76 -8 l-30 74 q-30 2 -38 -18z" fill="#ffffff" opacity=".35"/>
    <path d="M540 314 q34 0 68 8 l-6 48 q-6 28 -30 32z" fill="#ffffff" opacity=".22"/>
  </g>

  <!-- smile and nose shading -->
  <path d="M500 372 q-8 34 -14 52 q-2 12 12 14" stroke="#8a4525" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M452 486 q48 30 96 0 q-10 34 -48 34 q-38 0 -48 -34z" fill="#7c3524"/>
  <path d="M462 492 q38 20 76 0 q-8 16 -38 16 q-30 0 -38 -16z" fill="#ffffff"/>

  <!-- open jacket over a dark tee -->
  <path d="M500 556 q-150 0 -216 84 q-52 66 -64 610 l168 0 q10 -260 34 -420 l78 -120z" fill="url(#jacket)"/>
  <path d="M500 556 q150 0 216 84 q52 66 64 610 l-168 0 q-10 -260 -34 -420 l-78 -120z" fill="url(#jacket)"/>
  <path d="M500 556 l-78 154 q-24 160 -34 540 l224 0 q-10 -380 -34 -540z" fill="#191423"/>
  <path d="M500 556 l-60 108 l60 84 l60 -84z" fill="#f5eefc"/>
  <!-- chain -->
  <path d="M428 590 q72 66 144 0" stroke="#ffd166" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="500" cy="664" r="13" fill="#ffd166"/>

  <!-- one hand raised in a wave -->
  <g>
    <path d="M716 640 q66 -20 84 30 q30 -52 52 -48 q16 4 8 34 q22 -30 38 -22 q14 8 -2 40 q24 -14 32 -2 q8 14 -16 34 q-30 66 -88 84 q-66 20 -108 -28z" fill="url(#skin)"/>
    <rect x="700" y="742" width="86" height="40" rx="18" fill="#ffd166" transform="rotate(24 743 762)"/>
  </g>

  <!-- sparkle on the shades -->
  <path d="M596 296 l7 20 l20 7 l-20 7 l-7 20 l-7 -20 l-20 -7 l20 -7z" fill="#ffffff"/>
</svg>
