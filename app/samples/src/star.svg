<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e83e8c"/>
      <stop offset="1" stop-color="#a41358"/>
    </linearGradient>
    <linearGradient id="shades" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76e"/>
      <stop offset=".55" stop-color="#c2571b"/>
      <stop offset="1" stop-color="#571f3d"/>
    </linearGradient>
  </defs>

  <!-- raised left arm, waving: forearm and open hand -->
  <path d="M282 640 Q196 560 168 448 L238 420 Q268 520 330 588 Z" fill="#8a4f24"/>
  <g fill="#a05f2c">
    <path d="M150 452 Q128 380 142 318 L168 322 Q162 386 176 440 Z"/>
    <path d="M176 446 Q168 368 188 306 L214 314 Q200 382 204 444 Z"/>
    <path d="M204 444 Q202 372 226 318 L250 330 Q232 388 232 446 Z"/>
    <path d="M140 330 Q110 300 122 268 Q158 282 164 322 Z"/>
  </g>
  <path d="M282 640 Q196 560 168 448 L238 420 Q268 520 330 588 Z" fill="#000000" opacity=".12"/>

  <!-- right arm bent, hand resting at the waist -->
  <path d="M706 622 Q792 640 812 724 L742 748 Q724 690 682 668 Z" fill="url(#blazer)"/>
  <path d="M742 724 Q788 706 820 730 Q806 772 762 778 Q736 760 742 724 Z" fill="#a05f2c"/>

  <!-- torso: magenta blazer over a white top, gold belt -->
  <path d="M250 1250 L262 806 Q266 668 348 612 L448 566 L552 566 L660 606 Q726 640 736 742 L742 1250 Z" fill="url(#blazer)"/>
  <path d="M446 566 L554 566 L586 1250 L414 1250 Z" fill="#f7f2e9"/>
  <path d="M446 566 L506 730 L458 872 L420 606 Z" fill="#7e0d43"/>
  <path d="M554 566 L494 730 L542 872 L580 606 Z" fill="#7e0d43"/>
  <path d="M660 606 Q726 640 736 742 L742 1250 L668 1250 L648 742 Q640 650 660 606 Z" fill="#000000" opacity=".10"/>
  <rect x="404" y="1120" width="192" height="26" fill="#3a2312"/>
  <rect x="472" y="1112" width="56" height="42" rx="8" fill="#ffd76e"/>
  <!-- pendant -->
  <path d="M452 584 Q500 664 548 584" stroke="#ffd76e" stroke-width="9" fill="none"/>
  <circle cx="500" cy="650" r="13" fill="#ffd76e"/>
  <circle cx="500" cy="650" r="6" fill="#c2922e"/>
  <!-- rim light: cyan down the waving side, warm gold down the other -->
  <path d="M272 820 Q264 1040 270 1240" stroke="#19d3ff" stroke-width="9" fill="none" opacity=".7"/>
  <path d="M730 760 Q736 1000 734 1240" stroke="#ffb347" stroke-width="9" fill="none" opacity=".7"/>

  <!-- neck and head -->
  <rect x="462" y="428" width="76" height="140" fill="#8a4f24"/>
  <ellipse cx="500" cy="330" rx="112" ry="138" fill="#a05f2c"/>
  <path d="M432 402 Q500 492 568 402 L562 446 Q500 512 438 446 Z" fill="#5f3418" opacity=".25"/>

  <!-- voluminous curly hair, a cloud of ringlets -->
  <g fill="#170d08">
    <circle cx="500" cy="176" r="98"/>
    <circle cx="402" cy="216" r="72"/><circle cx="598" cy="216" r="72"/>
    <circle cx="368" cy="300" r="62"/><circle cx="632" cy="300" r="62"/>
    <circle cx="382" cy="386" r="48"/><circle cx="618" cy="386" r="48"/>
    <circle cx="448" cy="128" r="62"/><circle cx="556" cy="124" r="58"/>
    <circle cx="500" cy="238" r="86"/>
  </g>
  <g fill="none" stroke="#3a2312" stroke-width="7" opacity=".8">
    <path d="M452 118 Q420 150 428 190"/>
    <path d="M548 108 Q584 140 574 184"/>
    <path d="M392 250 Q362 282 372 322"/>
    <path d="M612 252 Q640 286 628 326"/>
  </g>

  <!-- hoop earrings -->
  <circle cx="382" cy="420" r="24" fill="none" stroke="#ffd76e" stroke-width="9"/>
  <circle cx="618" cy="420" r="24" fill="none" stroke="#ffd76e" stroke-width="9"/>

  <!-- aviator shades with a sunset in them -->
  <path d="M398 296 Q398 268 436 268 L484 268 Q500 268 500 284 Q500 268 516 268 L564 268 Q602 268 602 296 Q602 356 556 362 Q512 366 502 322 Q498 306 492 322 Q482 366 444 362 Q398 356 398 296 Z" fill="url(#shades)"/>
  <path d="M398 292 L602 292" stroke="#3a2312" stroke-width="10"/>
  <path d="M416 300 L470 300 L448 344 L420 344 Z" fill="#ffffff" opacity=".35"/>

  <!-- smile -->
  <path d="M458 428 Q500 458 542 428" stroke="#5f3418" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M470 436 Q500 452 530 436 Q500 446 470 436 Z" fill="#ffffff"/>
</svg>
