<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0563f"/>
      <stop offset="1" stop-color="#c22e28"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a63b8"/>
      <stop offset=".55" stop-color="#1b2350"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
  </defs>

  <!-- neck -->
  <rect x="460" y="420" width="80" height="130" fill="#9a5a2e"/>

  <!-- raised right arm: sleeve, forearm, thumbs-up -->
  <path d="M688 586 Q792 596 850 666 L798 738 Q744 690 686 692 Z" fill="#c22e28"/>
  <path d="M794 700 Q804 592 828 494 L886 504 Q870 600 874 708 Z" fill="#b26a35"/>
  <rect x="822" y="404" width="68" height="96" rx="25" fill="#b26a35"/>
  <rect x="872" y="420" width="31" height="56" rx="15" transform="rotate(16 887 448)" fill="#b26a35"/>
  <path d="M830 448 Q856 438 884 448" stroke="#8a4f24" stroke-width="6" fill="none"/>
  <path d="M830 474 Q856 464 884 474" stroke="#8a4f24" stroke-width="6" fill="none"/>

  <!-- torso: open jacket over a cream tee -->
  <path d="M214 1250 L224 762 Q230 642 302 596 L420 546 L500 560 L580 546 L668 580 Q716 606 726 690 L718 900 L728 1250 Z" fill="url(#jacket)"/>
  <path d="M438 550 L562 550 L598 1250 L402 1250 Z" fill="#f4efe6"/>
  <path d="M438 550 L502 706 L450 838 L418 596 Z" fill="#8e1f1a"/>
  <path d="M562 550 L498 706 L550 838 L582 596 Z" fill="#8e1f1a"/>
  <path d="M580 546 L668 580 Q716 606 726 690 L718 900 L728 1250 L640 1250 L620 700 Q606 600 580 546 Z" fill="#000000" opacity=".10"/>
  <!-- gold chain -->
  <path d="M428 566 Q500 652 572 566" stroke="#ffd76e" stroke-width="10" fill="none"/>
  <circle cx="500" cy="636" r="15" fill="#ffd76e"/>
  <circle cx="500" cy="636" r="7" fill="#c2922e"/>
  <!-- left hand at the hem -->
  <path d="M234 1250 L238 1122 Q240 1080 264 1082 Q288 1084 286 1126 L284 1250 Z" fill="#b26a35"/>
  <!-- rim light: cyan on the left edge, magenta on the raised arm -->
  <path d="M226 770 Q216 1010 226 1244" stroke="#19d3ff" stroke-width="9" fill="none" opacity=".75"/>
  <path d="M874 700 Q870 596 886 508" stroke="#ff2e88" stroke-width="9" fill="none" opacity=".75"/>

  <!-- head -->
  <ellipse cx="384" cy="332" rx="17" ry="26" fill="#b26a35"/>
  <ellipse cx="616" cy="332" rx="17" ry="26" fill="#b26a35"/>
  <ellipse cx="500" cy="308" rx="118" ry="142" fill="#b26a35"/>
  <path d="M424 386 Q500 486 576 386 L572 428 Q500 502 428 428 Z" fill="#3a2312" opacity=".22"/>
  <!-- hair, swept fringe -->
  <path d="M380 306 Q368 138 500 134 Q632 138 620 306 Q606 214 542 196 Q562 240 518 214 Q468 188 446 228 Q418 202 412 254 Q398 284 380 306 Z" fill="#1d130c"/>
  <!-- sunglasses -->
  <rect x="394" y="276" width="212" height="68" rx="30" fill="#0d0d12"/>
  <rect x="406" y="285" width="86" height="50" rx="21" fill="url(#lens)"/>
  <rect x="508" y="285" width="86" height="50" rx="21" fill="url(#lens)"/>
  <rect x="490" y="296" width="20" height="11" rx="5" fill="#ffd76e"/>
  <path d="M500 348 L491 388 Q500 397 511 388" stroke="#8a4f24" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M460 418 Q500 446 540 418" stroke="#5f3418" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
