<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a4e"/>
      <stop offset=".55" stop-color="#6d3a86"/>
      <stop offset=".82" stop-color="#e2607e"/>
      <stop offset="1" stop-color="#ff9a76"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c2350"/>
      <stop offset="1" stop-color="#170d28"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#dusk)"/>
  <circle cx="770" cy="300" r="70" fill="#ffe9a8" opacity=".95"/>
  <circle cx="770" cy="300" r="120" fill="#ffe9a8" opacity=".18"/>
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="3"/><circle cx="300" cy="70" r="2.4"/><circle cx="520" cy="150" r="2.8"/>
    <circle cx="880" cy="90" r="2.2"/><circle cx="660" cy="60" r="2"/><circle cx="190" cy="230" r="2"/>
    <circle cx="430" cy="250" r="1.8"/><circle cx="950" cy="200" r="2.6"/>
  </g>

  <!-- far skyline -->
  <g fill="#2a1745">
    <rect x="-10" y="600" width="120" height="330"/>
    <rect x="130" y="660" width="85" height="270"/>
    <rect x="235" y="560" width="130" height="370"/>
    <rect x="385" y="640" width="70" height="290"/>
    <rect x="640" y="620" width="95" height="310"/>
    <rect x="755" y="540" width="120" height="390"/>
    <rect x="895" y="650" width="115" height="280"/>
    <rect x="782" y="500" width="16" height="44"/>
  </g>
  <g fill="#ffd76e" opacity=".85">
    <rect x="30" y="640" width="11" height="13"/><rect x="62" y="690" width="11" height="13"/>
    <rect x="262" y="600" width="11" height="13"/><rect x="300" y="655" width="11" height="13"/>
    <rect x="262" y="720" width="11" height="13"/><rect x="668" y="665" width="11" height="13"/>
    <rect x="790" y="590" width="11" height="13"/><rect x="826" y="640" width="11" height="13"/>
    <rect x="790" y="700" width="11" height="13"/><rect x="928" y="690" width="11" height="13"/>
  </g>

  <!-- water tower on the right block -->
  <g fill="#1d0f33">
    <path d="M806 540 L818 452 L902 452 L914 540 Z"/>
    <rect x="812" y="438" width="96" height="16" rx="4"/>
    <path d="M860 438 L860 402 L884 438 Z"/>
    <rect x="826" y="540" width="10" height="70"/><rect x="884" y="540" width="10" height="70"/>
  </g>

  <!-- rooftop floor and ledge -->
  <rect y="930" width="1000" height="320" fill="url(#roof)"/>
  <rect y="906" width="1000" height="30" fill="#12081f"/>
  <rect y="900" width="1000" height="8" fill="#ff8a5c" opacity=".5"/>

  <!-- string lights across the roof -->
  <path d="M40 700 Q 500 830 960 690" stroke="#12081f" stroke-width="5" fill="none"/>
  <g>
    <circle cx="150" cy="742" r="11" fill="#ffd76e"/><circle cx="290" cy="772" r="11" fill="#ff5e8a"/>
    <circle cx="430" cy="788" r="11" fill="#7df9ff"/><circle cx="570" cy="788" r="11" fill="#ffd76e"/>
    <circle cx="710" cy="770" r="11" fill="#ff5e8a"/><circle cx="850" cy="738" r="11" fill="#7df9ff"/>
    <circle cx="150" cy="742" r="20" fill="#ffd76e" opacity=".25"/><circle cx="430" cy="788" r="20" fill="#7df9ff" opacity=".25"/>
    <circle cx="710" cy="770" r="20" fill="#ff5e8a" opacity=".25"/>
