    <path d="M428 940 L470 940 L462 1130 Q460 1170 430 1172 Q404 1170 408 1128 Z" fill="#232a3d"/>
    <path d="M530 940 L572 940 L592 1128 Q596 1170 570 1172 Q540 1170 538 1130 Z" fill="#1b2130"/>
    <path d="M398 1170 L466 1170 Q474 1196 452 1200 L404 1200 Q392 1186 398 1170 Z" fill="#f2f2f2"/>
    <path d="M534 1170 L602 1170 Q612 1186 596 1200 L542 1200 Q528 1196 534 1170 Z" fill="#f2f2f2"/>
    <!-- torso: open shirt over a tee -->
    <path d="M408 940 Q400 800 424 716 Q436 668 500 664 Q564 668 576 716 Q600 800 592 940 Q500 962 408 940 Z" fill="#f4efe6"/>
    <path d="M424 716 Q436 668 500 664 L500 950 Q452 956 408 940 Q400 800 424 716 Z" fill="#19b8a6"/>
    <path d="M576 716 Q564 668 500 664 L500 950 Q548 956 592 940 Q600 800 576 716 Z" fill="#128a7d"/>
    <path d="M468 690 L500 760 L532 690 L532 664 L468 664 Z" fill="#e8483f"/>
    <!-- arms resting on knees -->
    <path d="M424 724 Q372 790 388 880 Q394 922 428 936 L446 900 Q420 830 446 748 Z" fill="#128a7d"/>
    <path d="M576 724 Q628 790 612 880 Q606 922 572 936 L554 900 Q580 830 554 748 Z" fill="#0e6b60"/>
    <circle cx="436" cy="918" r="17" fill="#c98d5f"/>
    <circle cx="564" cy="918" r="17" fill="#c98d5f"/>
    <!-- head -->
    <circle cx="500" cy="580" r="72" fill="#c98d5f"/>
    <path d="M428 566 Q424 486 500 482 Q576 486 572 566 Q566 512 500 510 Q436 512 428 566 Z" fill="#241407"/>
    <path d="M440 600 Q500 656 560 600 L552 640 Q500 664 448 640 Z" fill="#241407"/>
    <rect x="440" y="556" width="120" height="24" rx="12" fill="#12060f"/>
    <rect x="448" y="561" width="46" height="14" rx="7" fill="#ffb347" opacity=".8"/>
    <rect x="506" y="561" width="46" height="14" rx="7" fill="#ffb347" opacity=".8"/>
  </g>

  <!-- a crate and a bottle beside the figure -->
  <g>
    <rect x="676" y="852" width="120" height="84" fill="#5a3a22"/>
    <rect x="676" y="852" width="120" height="16" fill="#6e482c"/>
    <rect x="690" y="884" width="92" height="10" fill="#3c2513"/>
    <path d="M846 936 L846 866 Q846 850 858 846 L858 824 L874 824 L874 846 Q886 850 886 866 L886 936 Z" fill="#2e7d5b"/>
    <rect x="852" y="872" width="28" height="34" fill="#ffd76e"/>
  </g>
