<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="dusky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1440"/>
      <stop offset=".5" stop-color="#5b2f78"/>
      <stop offset=".8" stop-color="#c8507c"/>
      <stop offset="1" stop-color="#ff9a76"/>
    </linearGradient>
    <linearGradient id="roofdeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46255c"/>
      <stop offset="1" stop-color="#12081f"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#dusky)"/>

  <!-- early stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="96" r="3"/><circle cx="262" cy="150" r="2.2"/><circle cx="448" cy="80" r="2.6"/>
    <circle cx="612" cy="170" r="2"/><circle cx="905" cy="130" r="2.8"/><circle cx="720" cy="64" r="2.2"/>
    <circle cx="150" cy="262" r="1.9"/><circle cx="540" cy="238" r="1.7"/><circle cx="958" cy="268" r="2"/>
    <circle cx="352" cy="300" r="1.6"/><circle cx="60" cy="380" r="1.7"/><circle cx="840" cy="330" r="1.8"/>
  </g>

  <!-- rising moon -->
  <circle cx="238" cy="330" r="86" fill="#ffedb5"/>
  <circle cx="238" cy="330" r="130" fill="#ffedb5" opacity=".16"/>
  <circle cx="206" cy="306" r="13" fill="#e8d194" opacity=".7"/>
  <circle cx="268" cy="356" r="9" fill="#e8d194" opacity=".7"/>

  <!-- far towers -->
  <g fill="#241239">
    <rect x="-6" y="640" width="128" height="300"/>
    <rect x="142" y="586" width="92" height="354"/>
    <rect x="254" y="668" width="118" height="272"/>
    <rect x="392" y="606" width="76" height="334"/>
    <rect x="618" y="652" width="104" height="288"/>
    <rect x="742" y="566" width="126" height="374"/>
    <rect x="888" y="646" width="118" height="294"/>
    <rect x="792" y="522" width="18" height="48"/>
  </g>
  <g fill="#ffd76e" opacity=".9">
    <rect x="24" y="676" width="11" height="13"/><rect x="56" y="722" width="11" height="13"/>
    <rect x="168" y="622" width="11" height="13"/><rect x="196" y="676" width="11" height="13"/>
    <rect x="168" y="742" width="11" height="13"/><rect x="286" y="700" width="11" height="13"/>
    <rect x="412" y="646" width="11" height="13"/><rect x="412" y="706" width="11" height="13"/>
    <rect x="648" y="690" width="11" height="13"/><rect x="676" y="742" width="11" height="13"/>
    <rect x="772" y="606" width="11" height="13"/><rect x="806" y="662" width="11" height="13"/>
    <rect x="772" y="726" width="11" height="13"/><rect x="922" y="686" width="11" height="13"/>
  </g>
  <g fill="#7df9ff" opacity=".8">
    <rect x="286" y="646" width="11" height="13"/><rect x="648" y="646" width="11" height="13"/>
    <rect x="806" y="716" width="11" height="13"/><rect x="56" y="676" width="11" height="13"/>
  </g>

  <!-- our rooftop -->
  <path d="M0 1250 L0 940 L1000 906 L1000 1250 Z" fill="url(#roofdeck)"/>
  <rect x="0" y="928" width="1000" height="14" fill="#12081f"/>

  <!-- water tower on a neighbouring roof, silhouetted -->
  <g fill="#170b28">
    <rect x="700" y="742" width="150" height="66" rx="10"/>
    <path d="M692 742 L775 692 L858 742 Z"/>
    <rect x="716" y="808" width="12" height="112"/>
    <rect x="822" y="808" width="12" height="112"/>
    <rect x="706" y="852" width="138" height="10"/>
  </g>

  <!-- bulkhead hut with a warm door and a cool window -->
  <g>
    <rect x="96" y="806" width="196" height="150" fill="#2a1544"/>
    <rect x="126" y="836" width="62" height="120" fill="#ffd76e"/>
    <rect x="126" y="836" width="62" height="120" fill="none" stroke="#12081f" stroke-width="6"/>
    <rect x="210" y="830" width="52" height="52" fill="#7df9ff" opacity=".75"/>
  </g>

  <!-- railing -->
  <g stroke="#0d0518" stroke-width="10">
    <path d="M0 986 L1000 952" fill="none"/>
    <path d="M60 984 L60 1080" fill="none"/><path d="M210 979 L210 1075" fill="none"/>
    <path d="M360 974 L360 1069" fill="none"/><path d="M510 968 L510 1063" fill="none"/>
    <path d="M660 963 L660 1058" fill="none"/><path d="M810 957 L810 1052" fill="none"/>
    <path d="M950 953 L950 1048" fill="none"/>
  </g>

  <!-- string lights sagging over the deck -->
  <path d="M40 830 Q300 940 560 872 Q800 818 972 884" stroke="#12081f" stroke-width="5" fill="none"/>
  <g>
    <circle cx="150" cy="872" r="11" fill="#ffb347"/><circle cx="290" cy="898" r="11" fill="#ff5e8a"/>
    <circle cx="430" cy="896" r="11" fill="#7df9ff"/><circle cx="566" cy="872" r="11" fill="#ffd76e"/>
    <circle cx="700" cy="848" r="11" fill="#ff5e8a"/><circle cx="836" cy="846" r="11" fill="#ffb347"/>
    <circle cx="150" cy="872" r="22" fill="#ffb347" opacity=".25"/><circle cx="430" cy="896" r="22" fill="#7df9ff" opacity=".25"/>
    <circle cx="836" cy="846" r="22" fill="#ffb347" opacity=".25"/>
  </g>

  <!-- deck chairs and a cooler: somebody is up here enjoying the view -->
  <g fill="#0d0518">
    <path d="M392 1120 L470 1052 L486 1064 L428 1130 L500 1136 L498 1154 L392 1146 Z"/>
    <path d="M560 1148 L636 1082 L652 1094 L596 1156 L664 1160 L662 1178 L560 1172 Z"/>
  </g>
  <rect x="716" y="1108" width="86" height="54" rx="8" fill="#c22e5e"/>
  <rect x="716" y="1108" width="86" height="14" rx="7" fill="#f4efe6"/>
</svg>
