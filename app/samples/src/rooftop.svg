<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191038"/>
      <stop offset=".45" stop-color="#5b2a72"/>
      <stop offset=".72" stop-color="#c94f6d"/>
      <stop offset="1" stop-color="#ff9e5e"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#dusk)"/>
  <circle cx="770" cy="690" r="86" fill="#ffdf9e"/>
  <circle cx="770" cy="690" r="64" fill="#fff3b0"/>

  <!-- skyline layers -->
  <g fill="#31184a">
    <rect x="0" y="620" width="120" height="240"/><rect x="150" y="570" width="86" height="290"/>
    <rect x="270" y="640" width="110" height="220"/><rect x="640" y="600" width="96" height="260"/>
    <rect x="880" y="580" width="120" height="280"/>
  </g>
  <g fill="#ffd166" opacity=".7">
    <rect x="24" y="650" width="11" height="15"/><rect x="66" y="700" width="11" height="15"/>
    <rect x="176" y="610" width="11" height="15"/><rect x="296" y="676" width="11" height="15"/>
    <rect x="664" y="640" width="11" height="15"/><rect x="906" y="620" width="11" height="15"/>
    <rect x="946" y="690" width="11" height="15"/><rect x="330" y="720" width="11" height="15"/>
  </g>
  <g fill="#1c0d33">
    <rect x="420" y="660" width="70" height="200"/><rect x="520" y="620" width="58" height="240"/>
  </g>

  <!-- the rooftop itself -->
  <polygon points="0,1250 0,880 1000,880 1000,1250" fill="#241233"/>
  <polygon points="0,908 1000,872 1000,892 0,928" fill="#170a24"/>
  <!-- parapet and railing -->
  <rect x="0" y="852" width="1000" height="30" fill="#170a24"/>
  <g stroke="#0f0619" stroke-width="9">
    <path d="M40 852 l0 -64"/><path d="M180 852 l0 -64"/><path d="M320 852 l0 -64"/>
    <path d="M680 852 l0 -64"/><path d="M820 852 l0 -64"/><path d="M960 852 l0 -64"/>
    <path d="M20 792 l960 0"/>
  </g>
  <!-- water tower -->
  <g fill="#170a24">
    <path d="M96 560 l64 -44 l64 44 l0 96 l-128 0z"/>
    <rect x="88" y="540" width="144" height="16"/>
    <path d="M116 656 l-14 130 M204 656 l14 130 M160 656 l0 130" stroke="#170a24" stroke-width="11"/>
  </g>
  <!-- planters -->
  <g>
    <rect x="700" y="1010" width="180" height="66" rx="8" fill="#170a24"/>
    <path d="M716 1012 q10 -52 44 -66 q-6 30 8 48 q14 -34 48 -40 q-8 26 4 42 q16 -22 40 -24 q-14 22 -12 40z" fill="#123524"/>
    <rect x="96" y="1060" width="140" height="56" rx="8" fill="#170a24"/>
    <path d="M110 1062 q8 -40 34 -52 q-4 24 6 38 q12 -28 38 -32 q-6 20 4 34 q12 -18 32 -20 q-10 18 -10 32z" fill="#123524"/>
  </g>

  <!-- string lights across the parapet -->
  <path d="M30 800 q240 90 470 34 q240 -56 470 -20" stroke="#0f0619" stroke-width="5" fill="none"/>
  <g>
    <circle cx="150" cy="830" r="26" fill="url(#lampGlow)"/><circle cx="150" cy="830" r="8" fill="#ffd166"/>
    <circle cx="290" cy="852" r="26" fill="url(#lampGlow)"/><circle cx="290" cy="852" r="8" fill="#ffd166"/>
    <circle cx="440" cy="856" r="26" fill="url(#lampGlow)"/><circle cx="440" cy="856" r="8" fill="#ffd166"/>
    <circle cx="590" cy="838" r="26" fill="url(#lampGlow)"/><circle cx="590" cy="838" r="8" fill="#ffd166"/>
    <circle cx="730" cy="820" r="26" fill="url(#lampGlow)"/><circle cx="730" cy="820" r="8" fill="#ffd166"/>
    <circle cx="870" cy="812" r="26" fill="url(#lampGlow)"/><circle cx="870" cy="812" r="8" fill="#ffd166"/>
  </g>

  <!-- a man taking in the city, fishing rod over one shoulder -->
  <g fill="#0d0518">
    <circle cx="505" cy="742" r="40"/>
    <path d="M470 736 q35 -34 70 0 l6 14 l-82 0z"/>
    <path d="M462 1250 l8 -330 q2 -52 20 -74 l-6 -64 l44 0 l-4 62 q20 22 22 76 l8 330 -40 0 -10 -250 -8 0 -8 250z"/>
    <path d="M486 800 q70 -60 150 -96" stroke="#0d0518" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M636 704 q60 -26 118 -30" stroke="#0d0518" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M470 830 q-52 10 -84 44" stroke="#0d0518" stroke-width="15" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M754 674 q4 60 -6 108" stroke="#ffd166" stroke-width="2.5" fill="none" opacity=".8"/>
  <circle cx="748" cy="788" r="5" fill="#ffd166"/>
</svg>
