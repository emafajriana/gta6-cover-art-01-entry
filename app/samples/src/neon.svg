<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030f"/>
      <stop offset=".55" stop-color="#131038"/>
      <stop offset="1" stop-color="#0a2038"/>
    </linearGradient>
    <linearGradient id="pavement" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a33"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff71ce" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff71ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#01cdfe" stop-opacity=".8"/>
      <stop offset="1" stop-color="#01cdfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#night)"/>

  <!-- building masses -->
  <g fill="#0a0724">
    <rect x="0" y="120" width="240" height="700"/>
    <rect x="760" y="80" width="240" height="740"/>
    <rect x="300" y="240" width="150" height="580"/>
    <rect x="560" y="200" width="130" height="620"/>
  </g>
  <g fill="#ffd166" opacity=".55">
    <rect x="34" y="180" width="16" height="22"/><rect x="90" y="260" width="16" height="22"/>
    <rect x="150" y="150" width="16" height="22"/><rect x="796" y="150" width="16" height="22"/>
    <rect x="860" y="240" width="16" height="22"/><rect x="330" y="300" width="13" height="18"/>
    <rect x="592" y="270" width="13" height="18"/><rect x="640" y="360" width="13" height="18"/>
  </g>

  <!-- neon signs: a diner moon, a palm, a cocktail glass -->
  <circle cx="205" cy="430" r="190" fill="url(#pinkGlow)"/>
  <circle cx="795" cy="470" r="180" fill="url(#tealGlow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M268 380 a78 78 0 1 0 30 130 a62 62 0 1 1 -30 -130z" fill="#ff71ce" stroke="#ff71ce" stroke-width="6"/>
    <g stroke="#01cdfe" stroke-width="13">
      <path d="M795 560 q-4 -70 10 -120"/>
      <path d="M803 448 q-52 -34 -104 -22 q44 12 66 36 q-40 -8 -70 12 q36 0 58 18 q-24 2 -36 20 q26 -8 48 0 q14 6 22 20 q4 -22 16 -32 q20 -16 52 -18 q-30 -12 -52 0 q16 -20 48 -28 q-34 -2 -48 24z"/>
    </g>
    <g stroke="#ffd166" stroke-width="11">
      <path d="M120 640 l52 62 l52 -62 z"/>
      <path d="M172 702 l0 54"/>
      <path d="M140 772 l64 0"/>
    </g>
    <rect x="700" y="640" width="190" height="86" rx="43" fill="none" stroke="#ff71ce" stroke-width="10"/>
    <circle cx="795" cy="683" r="17" fill="#ff71ce" stroke="none"/>
  </g>

  <!-- wet pavement and its reflections -->
  <rect y="820" width="1000" height="430" fill="url(#pavement)"/>
  <g opacity=".5">
    <polygon points="150,850 230,850 262,1120 108,1120" fill="#ff71ce" opacity=".28"/>
    <polygon points="740,850 850,850 900,1160 690,1160" fill="#01cdfe" opacity=".25"/>
    <polygon points="440,850 560,850 585,1040 415,1040" fill="#ffd166" opacity=".16"/>
  </g>
  <g stroke="#9fd8ff" stroke-width="3" opacity=".35">
    <path d="M60 900 l180 0"/><path d="M700 950 l220 0"/><path d="M120 1060 l150 0"/>
    <path d="M560 1120 l260 0"/><path d="M300 1180 l180 0"/>
  </g>

  <!-- two friends under one umbrella -->
  <g fill="#04030c">
    <path d="M310 700 q190 -120 380 0 q-190 -52 -380 0z"/>
    <rect x="492" y="586" width="10" height="130" rx="5"/>
    <path d="M400 1250 l6 -300 q2 -34 30 -40 l14 -120 q3 -18 24 -18 l26 0 q20 0 23 18 l12 118 q28 8 30 42 l6 300 -44 0 -14 -240 -10 0 -12 240z"/>
    <circle cx="498" cy="742" r="34"/>
    <path d="M596 1250 l-4 -286 q-2 -32 -26 -38 l-12 -112 q-3 -18 -22 -18 l-24 0 q-20 0 -23 18 l-10 110 q-26 8 -28 40 l-4 286 42 0 12 -228 10 0 14 228z" transform="translate(60 0)"/>
    <circle cx="618" cy="748" r="32"/>
  </g>
  <g fill="#ff71ce" opacity=".8">
    <circle cx="436" cy="776" r="7"/><circle cx="560" cy="770" r="7"/>
  </g>
</svg>
